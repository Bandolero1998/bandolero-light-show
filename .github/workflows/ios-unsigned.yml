name: Build iOS IPA (free sideload)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "Expo did not generate an iOS workspace" >&2
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH=$(find "$PWD/build/ios/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "The iPhone .app bundle was not produced" >&2
            exit 1
          fi
          ROOT="$PWD"
          mkdir -p "$ROOT/ipa/Payload"
          cp -R "$APP_PATH" "$ROOT/ipa/Payload/"
          (cd "$ROOT/ipa" && /usr/bin/zip -qry "$ROOT/BANDOLERO-LIGHT-SHOW-unsigned.ipa" Payload)
          test -s "$ROOT/BANDOLERO-LIGHT-SHOW-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BANDOLERO-LIGHT-SHOW-unsigned-IPA
          path: BANDOLERO-LIGHT-SHOW-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
