name: Build iOS IPA (free sideload)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npx tsx --test tests/elm327-protocol.test.ts tests/vehicle-capabilities.test.ts tests/safety-interlock.test.ts tests/light-show-controller.test.ts

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem install cocoapods --no-document 2>/dev/null || true
          pod install --repo-update

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Expo did not generate an iOS workspace" >&2
            ls -la ios/ >&2
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE  scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -quiet \
            build 2>&1 | tail -100
          APP_PATH=$(find "$PWD/build/ios/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: The iPhone .app bundle was not produced" >&2
            find "$PWD/build/ios/Build/Products" -type d 2>/dev/null || true
            exit 1
          fi
          ROOT="$PWD"
          mkdir -p "$ROOT/ipa/Payload"
          cp -R "$APP_PATH" "$ROOT/ipa/Payload/"
          (cd "$ROOT/ipa" && /usr/bin/zip -qry "$ROOT/BANDOLERO-LIGHT-SHOW-unsigned.ipa" Payload)
          test -s "$ROOT/BANDOLERO-LIGHT-SHOW-unsigned.ipa"
          echo "IPA successfully created: $(du -sh $ROOT/BANDOLERO-LIGHT-SHOW-unsigned.ipa)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BANDOLERO-LIGHT-SHOW-unsigned-IPA
          path: BANDOLERO-LIGHT-SHOW-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
